<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72"
     role="img" aria-label="SARTU WEBDESIGN">
  <title>SARTU WEBDESIGN</title>
  <!-- Lockup. Zeichen, Wortmarke, Beisatz.
       ACHTUNG: Die Wortmarke ist echter Text in der Systemschrift. Vor jedem
       Druck und vor jeder Weitergabe in Pfade umwandeln — sonst rendert sie
       auf fremden Geraeten anders. Design-Briefing §8. -->
  <polyline points="46,16 25,16 18,23 18,30 24,36 39,36 45,42 45,46 39,52"
            fill="none" stroke="#14110d" stroke-width="9" stroke-linejoin="round"/>
  <text x="72" y="45" fill="#14110d"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Helvetica, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-1.4">SARTU</text>
  <text x="74" y="60" fill="#5c554a"
        font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="10.5" font-weight="500" letter-spacing="4.4">WEBDESIGN</text>
</svg>
