<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 64" width="336" height="64"
     role="img" aria-label="SARTU Webdesign">
  <title>SARTU Webdesign</title>
  <!-- Lockup fuer dunklen Grund. Die Marke steht in Lime, die Wortmarke hell.
       Lime auf Tinte ist die belegte Kombination: 12,48:1.
       Umgekehrt gilt sie nicht — auf hellem Grund steht die Marke in Tinte,
       nie in Lime (1,32:1 gegen Creme). -->
  <g fill="#a3e635">
    <path d="M10 4h24v16H4V10a6 6 0 0 1 6-6z"/>
    <path d="M42 4h12a6 6 0 0 1 6 6v10H42z"/>
    <path d="M4 28h30v32H10a6 6 0 0 1-6-6z"/>
    <path d="M42 28h18v26a6 6 0 0 1-6 6H42z"/>
  </g>
  <text x="84" y="43" fill="#f6f1e6"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Helvetica, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.8">SARTU</text>
  <text x="86" y="58" fill="#a89b88"
        font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="10.5" font-weight="500" letter-spacing="1.7">WEBDESIGN</text>
</svg>
