<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="SARTU">
  <title>SARTU</title>
  <!-- Das Zeichen. Ein kantiges S aus einem durchgehenden Zug: waagerecht,
       diagonal, waagerecht, diagonal, waagerecht. Die Gelenke sind gerundet
       (stroke-linejoin="round") — das ist die Anpassung an die weiche
       Formsprache aus der Betreibervorgabe vom 25.07.2026.
       Einfarbig ueber currentColor. Keine Verlaeufe, keine Effekte.
       HINWEIS: Fuer Druck und Fremdweitergabe die Kontur in eine Flaeche
       umwandeln (Pfad erweitern). -->
  <polyline points="53,12 22,12 12,22 12,29 21,38 43,38 52,47 52,52 43,60"
            fill="none" stroke="currentColor" stroke-width="12"
            stroke-linejoin="round" stroke-linecap="butt"/>
</svg>
