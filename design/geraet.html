<!-- =============================================================
     SARTU — Geraeterahmen fuer den Aufmacher
     Arbeitsstand 10.08.2026, entschieden in
     SARTU_ENTSCHEIDUNGEN_OFFEN.md §4b. Zum Ansehen im Browser
     oeffnen. Reines CSS: kein 3D-Programm, kein Bild von aussen,
     keine Lizenz, kein externer Abruf.

     DIE FUENF DINGE, DIE DEN EINDRUCK TRAGEN — in dieser Reihenfolge:

       1. DIE AUFGEKLAPPTE BASIS mit Tastenfeld, Leertaste,
          Trackpad und Vorderkante. Sie ist `.basis`, eine Flaeche
          mit `transform-origin: 50% 0` und `rotateX(-70deg)`.
          FEHLT SIE, sieht das Geraet aus wie ein Bildschirm auf
          einem Stiel — genau daran ist die erste Fassung
          gescheitert. Das ist der groesste Einzeleffekt, groesser
          als die Perspektive.
       2. Kantenlicht: inset-Schatten hell oben und links, dunkel
          rechts und unten. An Deckel, Basis und Telefon.
       3. Gehaeuseverlauf statt Flaeche: linear-gradient ueber die
          Kippachse, hell an der zugewandten Kante.
       4. Glasreflex: ein diagonaler Verlauf ueber dem Schirm.
       5. Zwei Schattenlagen am Boden. Eine allein wirkt flach.

     DER BLICKWINKEL haengt an zwei Werten, die zusammengehoeren:
     `.geraete` kippt `rotateX(9deg)` — dadurch schaut man von
     oben auf die Basis. `.basis` legt sich mit `rotateX(-70deg)`
     hin. Wer den ersten Wert verkleinert, sieht die Tastatur
     nicht mehr.

     WAS NOCH ZU TUN IST:
       - Die Aufnahme auf dem Schirm ist ein PLATZHALTER aus
         design/portalkonzept.html. Sie wird durch die echte
         Aufnahme des laufenden Kundenbereichs ersetzt (§4b).
       - Die Grau- und Schwarzwerte stehen hier als Zahlen im
         Bauteil. Beim Uebernehmen gehoeren sie als eigene Gruppe
         nach design/tokens.css.
       - Unter 1024 px ist die Schraegstellung ungeprueft.
         Ueblich ist, sie dort zurueckzunehmen.
     ============================================================= -->
<style>
:root{
  --cream:#f6f6f4; --paper:#fff; --ink:#14110d; --line:#dfdfda; --lime:#a3e635;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:var(--font-sans)}
.raum{padding:110px 90px 200px;display:grid;place-items:center}

.buehne{perspective:2100px;perspective-origin:62% 40%;width:700px}
.geraete{transform-style:preserve-3d;transform:rotateY(-14deg) rotateX(9deg);position:relative}

/* ---------- Bodenschatten ---------- */
.geraete::before{content:"";position:absolute;left:2%;right:0%;bottom:-118px;height:120px;
  background:radial-gradient(50% 100% at 50% 0%,rgba(20,17,13,.34),transparent 72%);
  filter:blur(30px);transform:translateZ(-90px)}

/* ---------- Deckel ---------- */
.deckel{position:relative;transform-style:preserve-3d;
  background:linear-gradient(150deg,#4c4f4b 0%,#252825 13%,#191b19 46%,#0f110f 80%,#0a0b0a 100%);
  border-radius:20px 20px 5px 5px;padding:13px 13px 15px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.32),
             inset 1.5px 0 0 rgba(255,255,255,.14),
             inset -1.5px 0 0 rgba(0,0,0,.66),
             inset 0 -1px 0 rgba(0,0,0,.75)}
.kamera{width:5px;height:5px;border-radius:50%;margin:0 auto 8px;
  background:radial-gradient(circle at 35% 30%,#3d4a44,#0b0d0c 70%)}
.glas{position:relative;border-radius:9px;overflow:hidden;background:#0b0d0c;aspect-ratio:16/10;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.9),inset 0 2px 12px rgba(0,0,0,.5)}
.glas img{width:100%;display:block}
.glas::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(108deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.09) 13%,
             rgba(255,255,255,.02) 27%,transparent 47%,rgba(255,255,255,.05) 84%,rgba(255,255,255,.10) 100%)}

/* ---------- Basis: liegt in der Tiefe, mit Tastatur ---------- */
.basisraum{position:relative;height:0;transform-style:preserve-3d}
.basis{position:absolute;left:-0.6%;right:-0.6%;top:0;height:215px;
  transform-origin:50% 0;transform:rotateX(-70deg);
  background:linear-gradient(#33362f 0%,#242723 6%,#1a1c19 34%,#131512 74%,#0c0d0c 100%);
  border-radius:2px 2px 13px 13px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),
             inset 1.5px 0 0 rgba(255,255,255,.10),
             inset -1.5px 0 0 rgba(0,0,0,.6),
             0 0 60px rgba(0,0,0,.45);
  padding:22px 7% 0}
/* Schattenkeil dort, wo Deckel und Basis zusammenstossen */
.basis::before{content:"";position:absolute;left:0;right:0;top:0;height:64px;
  background:linear-gradient(rgba(0,0,0,.72),transparent);border-radius:2px 2px 0 0}
/* Tastenfeld */
.tasten{position:relative;height:96px;border-radius:5px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,
      #23261f 0 2.9%, #080908 2.9% 3.55%),
    linear-gradient(#1e211b,#101210);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.05)}
.reihen{position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 17%,rgba(0,0,0,.85) 17% 21%)}
/* Leertaste */
.leer{position:absolute;left:31%;right:31%;bottom:5px;height:19px;border-radius:3px;
  background:linear-gradient(#151715,#0c0d0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
/* Trackpad */
.pad{width:30%;height:58px;margin:16px auto 0;border-radius:7px;
  background:linear-gradient(#1a1c19,#121412);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(0,0,0,.55)}
/* Vorderkante mit Griffmulde */
.kante{position:absolute;left:0;right:0;bottom:0;height:11px;
  background:linear-gradient(#0e100e,#1c1e1b);border-radius:0 0 13px 13px}
.kante::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:2px;
  width:20%;height:5px;border-radius:99px;background:#070807}

/* ---------- Telefon ---------- */
.telefon{position:absolute;right:-17%;bottom:-40%;width:19%;
  transform:translateZ(150px) rotateY(5deg);
  background:linear-gradient(150deg,#565951 0%,#2b2e2a 12%,#181a18 44%,#0d0e0d 100%);
  border-radius:28px;padding:6px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.34),inset 1.5px 0 0 rgba(255,255,255,.15),
             inset -1.5px 0 0 rgba(0,0,0,.7),
             0 34px 54px -22px rgba(20,17,13,.62),0 6px 12px -6px rgba(20,17,13,.5)}
.telefon .glas{aspect-ratio:9/17.5;border-radius:23px}
.insel{position:absolute;left:50%;top:13px;transform:translateX(-50%);width:26%;height:7px;
  background:#080908;border-radius:999px;z-index:5}
.marke{position:absolute;left:-3%;top:-42px;font:600 11px/1 var(--font-sans);letter-spacing:.14em;
  text-transform:uppercase;background:var(--lime);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px}
</style>
<div class="raum">
  <div class="buehne">
    <div class="geraete">
      <span class="marke">Musteransicht</span>
      <div class="deckel">
        <div class="kamera"></div>
        <div class="glas"><img src="schirm-laptop.png" alt=""></div>
      </div>
      <div class="basisraum">
        <div class="basis">
          <div class="tasten"><div class="reihen"></div><div class="leer"></div></div>
          <div class="pad"></div>
          <div class="kante"></div>
        </div>
      </div>
      <div class="telefon"><div class="insel"></div><div class="glas"><img src="schirm-telefon.png" alt=""></div></div>
    </div>
  </div>
</div>
