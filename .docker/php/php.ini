; Entwicklungseinstellungen. Für die Produktion gelten andere Werte —
; display_errors gehört dort auf Off.

display_errors = On

; Verraet die PHP-Version in jeder Antwort. Sie sagt einem Angreifer, welche
; Schwachstellenlisten sich lohnen — und einem Betreiber nichts.
expose_php = Off
error_reporting = E_ALL
log_errors = On

upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 60

date.timezone = Europe/Berlin

; Sitzungen: Portal-Lastenheft §3
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Im Container läuft HTTP ohne TLS. Auf dem Produktivsystem muss dieser Wert auf 1 stehen,
; sonst wird das Sitzungscookie auch unverschlüsselt gesendet.
session.cookie_secure = 0

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
